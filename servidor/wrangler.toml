compatibility_date = "2024-11-01"

[vars]
# Origens autorizadas a consultar este servidor, separadas por vírgula e sem barra no final.
# Informe o endereço do site publicado no GitHub Pages.
ALLOWED_ORIGINS = "https://gabrielrosa-dev.github.io"

# Sincronização entre aparelhos: crie o espaço com `wrangler kv namespace create SYNC`
# e cole o identificador gerado abaixo.
[[kv_namespaces]]
binding = "SYNC"
id = "ce237709dfca4455a135e71afe688d02"
