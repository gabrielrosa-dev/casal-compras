name = "casalcompras-precos"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# Origens autorizadas a chamar o proxy, separadas por vírgula (sem barra no final).
# Troque pelo endereço do seu GitHub Pages.
ALLOWED_ORIGINS = "https://SEU-USUARIO.github.io"

# Sincronização entre aparelhos: rode `wrangler kv namespace create SYNC`
# e cole o id gerado abaixo.
[[kv_namespaces]]
binding = "SYNC"
id = "COLE_O_ID_DO_KV_AQUI"
