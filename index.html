<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="description" content="Lista de compras inteligente para casais: histórico, comparação de preços e modo supermercado.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CasalCompras">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CasalCompras - Inteligência Residencial</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icones/icon-192.png">
<!-- Aplica o tema salvo antes da tela carregar para evitar o clarão inicial. -->
<script src="codigo/tema.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="codigo/configuracao-tailwind.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="estilos/estilos.css">
</head>
<body class="bg-page text-ink">

<header class="fixed top-0 inset-x-0 z-30 bg-violet-700 text-white safe-top">
  <div class="max-w-2xl mx-auto px-4 py-2 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2 min-w-0">
      <button id="menuBtn" aria-label="Abrir menu" aria-controls="menuLateral" aria-expanded="false" title="Menu" class="tap w-9 h-9 -ml-1 rounded-full hover:bg-white/15 flex items-center justify-center">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
      <div class="w-8 h-8 rounded-lg bg-white/15 flex items-center justify-center shrink-0"><i data-lucide="shopping-basket" class="w-5 h-5"></i></div>
      <h1 class="font-bold text-base truncate">CasalCompras</h1>
    </div>
    <div id="profileSwitch" class="flex bg-black/20 rounded-full p-1 text-sm font-semibold shrink-0"></div>
  </div>
</header>

<main id="view" class="max-w-2xl mx-auto px-4 pt-[64px] pb-6"></main>
<datalist id="names"></datalist>

<div id="menuFundo" class="menu-fundo hidden" data-menu-close></div>
<aside id="menuLateral" class="menu-lateral hidden safe-top safe-bottom" role="dialog" aria-modal="true" aria-label="Menu do aplicativo">
  <div class="flex items-center justify-between px-4 py-3 border-b border-line">
    <h2 class="font-bold">Navegação</h2>
    <button data-menu-close aria-label="Fechar menu" title="Fechar" class="tap w-9 h-9 rounded-full hover:bg-soft flex items-center justify-center">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
  </div>
  <nav id="nav" aria-label="Navegação principal" class="p-3">
    <div id="tabs" class="space-y-1"></div>
  </nav>
  <div class="border-t border-line p-3 space-y-1">
    <button id="themeBtn" data-theme-toggle class="tap w-full rounded-xl px-3 py-3 flex items-center gap-3 text-left hover:bg-soft">
      <i data-lucide="moon" class="w-5 h-5 text-brand"></i>
      <span id="themeLabel" class="font-semibold text-sm">Modo escuro</span>
    </button>
    <button id="settingsBtn" data-tab="settings" class="tap w-full rounded-xl px-3 py-3 flex items-center gap-3 text-left hover:bg-soft">
      <i data-lucide="settings" class="w-5 h-5 text-brand"></i>
      <span class="font-semibold text-sm">Configurações</span>
    </button>
  </div>
</aside>

<div id="toast" role="status" class="fixed left-1/2 -translate-x-1/2 bottom-5 z-50 hidden max-w-[90%] bg-gray-900 text-white text-sm px-4 py-2 rounded-full shadow-lg text-center"></div>

<noscript><p class="p-6 text-center">O CasalCompras precisa de JavaScript para funcionar.</p></noscript>

<!-- A ordem importa: os scripts compartilham o escopo global do navegador. -->
<script src="codigo/configuracoes.js"></script>
<script src="codigo/utilitarios.js"></script>
<script src="codigo/dados.js"></script>
<script src="codigo/estado.js"></script>
<script src="codigo/inteligencia.js"></script>
<script src="codigo/receitas.js"></script>
<script src="codigo/servicos/precos.js"></script>
<script src="codigo/servicos/codigo-qr.js"></script>
<script src="codigo/servicos/nota-fiscal.js"></script>
<script src="codigo/servicos/sincronizacao.js"></script>
<script src="codigo/servicos/compartilhamento.js"></script>
<script src="codigo/servicos/pwa.js"></script>
<script src="codigo/telas/componentes.js"></script>
<script src="codigo/telas/lista.js"></script>
<script src="codigo/telas/historico-inteligente.js"></script>
<script src="codigo/telas/receitas.js"></script>
<script src="codigo/telas/comparar.js"></script>
<script src="codigo/telas/compras.js"></script>
<script src="codigo/telas/mercado.js"></script>
<script src="codigo/telas/primeiros-passos.js"></script>
<script src="codigo/telas/ajustes.js"></script>
<script src="codigo/aplicativo.js"></script>
</body>
</html>
